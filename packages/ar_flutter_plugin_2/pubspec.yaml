name: ar_flutter_plugin_2
description: Local vendored fork of ar_flutter_plugin_2 (upstream abandoned) — migrated to built-in Kotlin so it builds on AGP 9 / current Flutter.
version: 0.0.4
repository: https://github.com/hlefe/ar_flutter_plugin_2

environment:
  # Raised by the vendored fork: the built-in Kotlin migration requires
  # Flutter 3.44 / Dart 3.12 (plugin-author guide). Upstream said
  # ">=2.16.1 <3.0.0", which no longer resolves on Dart 3.
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.3.1
  vector_math: ^2.1.1
  json_annotation: ^4.9.0
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' and Android 'package' identifiers should not ordinarily
  # be modified. They are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: com.uhg0.ar_flutter_plugin_2
        pluginClass: ArFlutterPlugin
      ios:
        pluginClass: ArFlutterPlugin
