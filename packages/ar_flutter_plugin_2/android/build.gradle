// Groovy rule (Gradle 9): only buildscript/pluginManagement/plugins blocks
// may appear before plugins {} — group/version must come after it.
buildscript {
    ext.kotlin_version = '2.3.20'
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// Built-in Kotlin (AGP 9) compiles this module's Kotlin sources — the
// kotlin-android plugin must NOT be applied. Flutter plugin migration:
// https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
plugins {
    id 'com.android.library'
}

group 'com.uhg0.ar_flutter_plugin_2'
version '1.0-SNAPSHOT'

allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }
}

android {
    namespace 'com.uhg0.ar_flutter_plugin_2'
    compileSdk = 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk = 28
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'io.github.sceneview:arsceneview:2.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
